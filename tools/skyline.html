function rand(n) { return Math.floor(Math.random() * n); }

// Build a long pool of code text, then rows across the full canvas width
// Build one long code stream with no adjacent duplicate snippets; each line slices it at a random offset so consecutive lines never match
let stream = "";
{
  const allSnippets = snippets.concat(realSnippets).map(s => s.replace(/[^\x20-\x7E]/g, "")).filter(s => s.length > 10);
  let lastIdx = -1;
  while (stream.length < 30000) {
    let i; do { i = rand(allSnippets.length); } while (i === lastIdx);
    lastIdx = i;
    stream += allSnippets[i] + " ";
  }
}
// Vertical columns of code reading bottom-to-top; one global set so content flows seamlessly across building tiers and setbacks
const CW = 14;
const cols = [];
for (let x = 0; x < W + CW; x += CW) {
  const start = rand(stream.length - 230);
  cols.push({ x, text: stream.slice(start, start + 215) });
}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.fillStyle = BG;
ctx.fillRect(0, 0, W, H);
ctx.font = '13px Menlo, "SF Mono", monospace';
ctx.textBaseline = "top";
ctx.fillStyle = FG;

// Draw the code field clipped to a path. Columns are global (same content everywhere), so text flows seamlessly across setbacks and tiers.
function drawCodeInColumns(p2d, bounds) {
  ctx.save();
  ctx.clip(p2d);
  for (const c of cols) {
    if (c.x > bounds.x + bounds.w || c.x + CW < bounds.x) continue;
    ctx.save();
    ctx.translate(c.x, H + 2);
    ctx.rotate(-Math.PI / 2); // text reads bottom-to-top
    ctx.fillText(c.text, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

function rectPath(x, y, w, h) {
  const p = new Path2D();
  p.rect(x, y, w, h);
  return { p, b: { x, y, w, h } };
}
// solid fill for thin spires/antennas (text would be mush at this width) — slightly brighter than building code so they read
function solidRect(x, y, w, h) { const c = ctx.fillStyle; ctx.fillStyle = SPIRE; ctx.fillRect(x, y, w, h); ctx.fillStyle = c; }

// ---------- building shapes ----------
// slab: plain rectangle from ground up
function slab(x, w, h) { const r = rectPath(x, H - h, w, h); drawCodeInColumns(r.p, r.b); }

// Willis Tower: three setbacks + two antennas
function willis(x, w, h) {
  const t1 = rectPath(x, H - h * 0.62, w, h * 0.62);
  const t2 = rectPath(x + w * 0.15, H - h * 0.84, w * 0.7, h * 0.22);
  const t3 = rectPath(x + w * 0.28, H - h, w * 0.44, h * 0.16);
  drawCodeInColumns(t1.p, t1.b); drawCodeInColumns(t2.p, t2.b); drawCodeInColumns(t3.p, t3.b);
  solidRect(x + w * 0.34 - 3, H - h - 170, 16, 170);
  solidRect(x + w * 0.60 - 3, H - h - 135, 16, 135);
}

// John Hancock: tapered trapezoid + center antenna
function hancock(x, w, h) {
  const p = new Path2D();
  p.moveTo(x, H); p.lineTo(x + w * 0.22, H - h); p.lineTo(x + w * 0.78, H - h); p.lineTo(x + w, H); p.closePath();
  drawCodeInColumns(p, { x, y: H - h, w, h });
  solidRect(x + w / 2 - 8, H - h - 150, 16, 150);
}

// Wrigley Building: two tiers + clock-tower spire
function wrigley(x, w, h) {
  const t1 = rectPath(x, H - h * 0.72, w, h * 0.72);
  const t2 = rectPath(x + w * 0.25, H - h * 0.9, w * 0.5, h * 0.18);
  drawCodeInColumns(t1.p, t1.b); drawCodeInColumns(t2.p, t2.b);
  solidRect(x + w / 2 - 8, H - h - 160, 16, 160);
}

// Tribune Tower: rectangle with gothic battlements (teeth) on top
function tribune(x, w, h) {
  const p = new Path2D();
  const toothW = 26, gap = 18, toothH = 34;
  p.moveTo(x, H); p.lineTo(x, H - h + toothH);
  let cx = x;
  while (cx < x + w) {
    const tw = Math.min(toothW, x + w - cx);
    if (tw > gap * 0.6) { p.lineTo(cx, H - h + toothH); p.lineTo(cx, H - h); p.lineTo(cx + tw, H - h); p.lineTo(cx + tw, H - h + toothH); }
    cx += tw + gap;
  }
  p.lineTo(x + w, H - h + toothH); p.lineTo(x + w, H); p.closePath();
  drawCodeInColumns(p, { x, y: H - h, w, h });
}
